<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited{
            color: blue;
        }
        a:hover{
            color: black;
        }
        a::after{
            content: ' [link]';
            color: darkgray;
            text-decoration: none;
            font-weight: lighter;
        }
    </style>
</head>
<body>
    <h1>Links personalizados</h1>
    <ul>    
        <li><a href="https://youtube.com/playlist?list=PLnogX1pF2BksXeXbjKDJd2Z-Jg8NSQBv0&si=7dV1eDUs2YGxtEeJ" target="_blank">Minha playlist</a></li>
        <li><a href="https://youtube.com/playlist?list=PLHP0BseufEWJh6u91JtqEZLEJOYQE64Co&si=Oy0unUQeuWeOdH6Y" target="_blank">Minha playlist 2</a></li>
    </ul>
</body>
</html>
