<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Area</title>
    <style>
        .conteiner{
            display: grid;
            grid-template: repeat(3, auto)/ repeat(4,auto);
            border: 5px solid black;
            height: 95vh;
        }

        .caixa1{
            background-color: red;
            grid-area: 1 / 1 / 2 / 5;
        }

        .caixa2{
            background-color: blue;
            grid-area: 2/1/4/3;
        }

        .caixa3{
            /*
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 5;
            */
            background-color: green;
            grid-area: 2/3/4/5;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="caixa1"></div>
        <div class="caixa2"></div>
        <div class="caixa3"></div>

    </div>
</body>
</html>
