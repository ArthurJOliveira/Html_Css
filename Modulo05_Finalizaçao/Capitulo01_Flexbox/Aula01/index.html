<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .container{
            background-color: aqua;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
            height: 200px;
        } 
        
        .item{
            border: 1px solid black;
            background-color: bisque;
            flex-basis: 150px;
            text-align: center;
            padding: 10px;
        }

        #i1{
            align-self:flex-start;
            order: -4;
        }

        #i2{
            align-self: flex-end;
            order: 3;
        }

        #i3{
            align-self: auto;
            order: 0;
        }

        #i4{
            align-self: stretch;
            order: 10;
            height: auto;
        }

        #i5{
            align-self: flex-end;
            order: -10;
        }

        #i6{
            align-self:flex-start;
            order: 5;
        }

        #i7{
            align-self: flex-end;
            order: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">AAAAAAAAA</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
