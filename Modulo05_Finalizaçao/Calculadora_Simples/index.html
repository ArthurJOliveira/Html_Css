<!DOCTYPE html>
<html lang="pr-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora</title>
</head>
<body>
    <main>
        <header>
            <span id="resultado">
                
            </span>
        </header>

        <section>
            <button class="c" id="reset"><i class="fa-solid fa-trash-can"></i></button>
            <button class="limpo" id="limpar"><i class="fa-solid fa-delete-left"></i></button>
            <button class="num">1</button>
            <button class="num">2</button>
            <button class="num">3</button>
            <button class="op" id="vezes"><i class="fa-solid fa-xmark"></i><p>x</p></button>
            <button class="num">4</button>
            <button class="num">5</button>
            <button class="num">6</button>
            <button class="op"><i class="fa-solid fa-divide"></i><p>÷</p></button>
            <button class="num">7</button>
            <button class="num">8</button>
            <button class="num">9</button>
            <button class="op" id="igual" onclick="res()"><i class="fa-solid fa-equals"><p>=</p></i></button>
            <button class="op"><i class="fa-solid fa-minus"></i><p>-</p></button>
            <button class="num">0</button>
            <button class="op"><i class="fa-solid fa-plus"></i></i><p>+</p></button>
        </section>
    </main>
    <script src="calculadora.js"></script>
    <script src="https://kit.fontawesome.com/43adc5e0a2.js" crossorigin="anonymous"></script>
</body>
</html>
