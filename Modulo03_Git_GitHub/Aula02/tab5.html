<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes favoritos</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
            width: 750px;
            margin-bottom: 70px;
        }

        th,td{
            border: 1px solid black;
            padding: 15px; 
            text-align: center;
        }
        
        caption{
            font-size: 20px;
            font-weight: bold;
            background-color: #979393;
            border: 1px solid black;
            padding: 5px;
    }

    #col1{
        background-color: #fffcfc;
    }

    #col2{
        background-color: #a18e8e;
    }

    #col3{
        background-color: #979393c7;
    }
    </style>
</head>
<body>
    <table>
        <colgroup>
            <col id="col1">
            <col id="col2">
            <col id="col3" span="3">
        </col>
        <caption>Filmes favoritos</caption>
        <tr>
            <th scope="col">Grupo</th>
            <th scope="col">Nomes</th>
            <th colspan="3" scope="colgroup">Filmes</th>
        </tr>
        <tr>
            <th rowspan="4" scope="rowgroup">Mulheres</th>
        </tr>
        <tr>
            <td>Joana</td>
            <td>Shrek</td>
            <td>Shrek 2</td>
            <td>Shrek 3</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>Rambo</td>
            <td>Rango</td>
            <td>Rango Brabo</td>
        </tr>
        <tr>
            <td>Fernanda</td>
            <td>Neymar:O Caos Perfeito</td>
            <td>Batman: Begins</td>
            <td>Tartarugas Ninja</td>
        </tr>
        <tr>
            <th rowspan="4" scope="rowgroup">Homens</th>
        </tr>
        <tr>
            <td>Joao</td>
            <td>Jovens Titãs</td>
            <td>NBA</td>
            <td>NFL</td>
        </tr>
        <tr>
            <td>Nelson</td>
            <td>Rocket League</td>
            <td>Rugrats</td>
            <td>Apenas Um Show</td>
        </tr>
        <tr>
            <td>Augusto</td>
            <td>Matrix</td>
            <td>John Wick</td>
            <td>Deadpool</td>
        </tr>
    </table>
</body>
</html>
